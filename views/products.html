<section class="products-page">
  <h1>{{title}}</h1>

  {{#if showBanner}}
    <div class="banner">
      {{> banner}}
    </div>
  {{/if}}

  {{#if user}}
    <div class="user-info">Welcome, {{user.name}}!</div>
  {{/if}}

  {{#if products.length}}
    <div class="product-list">
      {{#each products}}
        {{> product-card}}
      {{/each}}
    </div>
  {{else}}
    <p class="empty">No products available.</p>
  {{/if}}
</section>
