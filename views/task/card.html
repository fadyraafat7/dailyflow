<article class="task-card" id="task-{{id}}" data-id="{{id}}" data-title="{{title}}" data-priority="{{priority}}" data-state="{{state}}">
  <div>
    <h4 class="task-card__title">{{title}}</h4>
    <div class="task-card__meta">
      <span class="badge priority--{{priority}}">{{priority}}</span>
      <span class="badge state--{{state}}">{{state}}</span>
      {{date}}
    </div>
    {{timeSummary}}
  </div>
  <div class="task-card__actions">
    <button type="button" class="btn-icon" title="Track time"
      @click="$dispatch('open-time-entry', { id: $el.closest('.task-card').dataset.id, title: $el.closest('.task-card').dataset.title })">⏱</button>
    <button type="button" class="btn-icon" title="Edit"
      @click="$dispatch('open-edit', { id: $el.closest('.task-card').dataset.id, title: $el.closest('.task-card').dataset.title, priority: $el.closest('.task-card').dataset.priority, state: $el.closest('.task-card').dataset.state })">✎</button>
    <button type="button" class="btn-icon btn-delete" title="Delete"
      hx-delete="/api/tasks/{{id}}" hx-target="closest .task-card" hx-swap="outerHTML"
      hx-confirm="Are you sure?">🗑</button>
  </div>
</article>
